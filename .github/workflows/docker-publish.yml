name: Docker Build & Push

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint and unit tests
        run: |
          uv run ruff check gptmock/ tests/
          uv run pytest tests/ --no-testmon -q

      - name: Build Docker image
        run: docker build --tag gptmock-ci:verify --file docker/Dockerfile .

      - name: Smoke test hardened Docker image
        run: >-
          docker run --rm --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --tmpfs /data:rw,nosuid,size=16m,uid=10001,gid=10001,mode=0700
          --cap-drop ALL --security-opt no-new-privileges:true
          --env GPTMOCK_HOME=/data
          --entrypoint /app/.venv/bin/python
          gptmock-ci:verify
          -c 'import os; from starlette.testclient import TestClient; from gptmock.app import create_app; from gptmock.core.settings import Settings; from gptmock.infra.auth import write_auth_file; assert os.getuid() == 10001; assert write_auth_file({"tokens": {"access_token": "test"}}); settings = Settings(api_key="proxy-secret"); assert len(settings.base_instructions) > 1000; client = TestClient(create_app(settings)); assert client.get("/health").status_code == 200; assert client.get("/v1/models").status_code == 401; assert client.get("/v1/models", headers={"Authorization": "Bearer proxy-secret"}).status_code == 200'

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gptmock:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gptmock:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
